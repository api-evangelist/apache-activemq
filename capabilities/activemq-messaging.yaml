naftiko: 1.0.0-alpha2
info:
  label: Apache ActiveMQ Messaging Workflow
  description: Unified capability for Apache ActiveMQ messaging operations and broker management. Used by application developers
    and platform operators to send/receive messages and monitor broker health.
  tags:
  - Apache ActiveMQ
  - Messaging
  - Broker Management
  - JMS
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ACTIVEMQ_USERNAME: ACTIVEMQ_USERNAME
    ACTIVEMQ_PASSWORD: ACTIVEMQ_PASSWORD
capability:
  consumes:
  - type: http
    namespace: activemq-rest
    baseUri: http://localhost:8161/api
    description: Apache ActiveMQ REST and Jolokia management API.
    authentication:
      type: basic
      username: '{{ACTIVEMQ_USERNAME}}'
      password: '{{ACTIVEMQ_PASSWORD}}'
    resources:
    - name: messages
      path: /message
      description: Produce and consume messages from queues and topics.
      operations:
      - name: send-message
        method: POST
        description: Send a message to a named destination.
        inputParameters:
        - name: destination
          in: path
          type: string
          required: true
        - name: type
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: receive-message
        method: GET
        description: Receive a message from a named destination.
        inputParameters:
        - name: destination
          in: path
          type: string
          required: true
        - name: type
          in: query
          type: string
          required: false
        - name: oneShot
          in: query
          type: boolean
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: management
      path: /jolokia
      description: Jolokia JMX-HTTP bridge for broker management.
      operations:
      - name: read-mbean
        method: GET
        description: Read JMX MBean attributes for broker monitoring.
        inputParameters:
        - name: mbean
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: activemq-messaging-api
    description: Unified REST API for ActiveMQ messaging and management.
    resources:
    - path: /v1/messages
      name: messages
      description: Produce and consume messages.
      operations:
      - method: POST
        name: send-message
        description: Send a message to a queue or topic.
        call: activemq-rest.send-message
        with:
          destination: rest.destination
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: receive-message
        description: Receive a message from a queue or topic.
        call: activemq-rest.receive-message
        with:
          destination: rest.destination
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/management/mbeans/{mbean}
      name: management
      description: Monitor broker JMX attributes.
      operations:
      - method: GET
        name: read-broker-metric
        description: Read a broker JMX MBean attribute.
        call: activemq-rest.read-mbean
        with:
          mbean: rest.mbean
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: activemq-messaging-mcp
    transport: http
    description: MCP server for AI-assisted ActiveMQ messaging and monitoring.
    tools:
    - name: send-message
      description: Send a message to an ActiveMQ queue or topic.
      hints:
        readOnly: false
        openWorld: false
      call: activemq-rest.send-message
      with:
        destination: tools.destination
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
    - name: receive-message
      description: Receive a message from an ActiveMQ queue or topic.
      hints:
        readOnly: true
        openWorld: false
      call: activemq-rest.receive-message
      with:
        destination: tools.destination
      outputParameters:
      - type: object
        mapping: $.
    - name: read-broker-metric
      description: Read a JMX MBean attribute from the ActiveMQ broker for monitoring.
      hints:
        readOnly: true
        openWorld: true
      call: activemq-rest.read-mbean
      with:
        mbean: tools.mbean
      outputParameters:
      - type: object
        mapping: $.
